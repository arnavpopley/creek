<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creek · __CREEK_TITLE__</title>
<style>
  /* Orca's theme tokens when shown inside Orca, with fallbacks for a plain browser.
     Local colours use their own names so Orca's live theme is never overridden. */
  :root {
    --ck-ok: #16a34a; --ck-open: #2563eb; --ck-wait: #d97706; --ck-bad: #dc2626; --ck-off: #8a8a8a; --ck-creek: #0d9488;
  }
  @media (prefers-color-scheme: dark) {
    :root { --ck-ok: #4ade80; --ck-open: #60a5fa; --ck-wait: #fbbf24; --ck-bad: #f87171; --ck-off: #8a8a8a; --ck-creek: #2dd4bf; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--background, #fff); color: var(--foreground, #171717);
    font: 14px/1.5 var(--font-sans, system-ui, -apple-system, "Segoe UI", sans-serif);
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 18px 16px 24px; }
  .mono { font-family: var(--font-mono, ui-monospace, SFMono-Regular, Menlo, monospace); }
  .muted { color: var(--muted-foreground, #6b6b6b); }

  /* Header */
  .top { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .top h1 { font-size: 18px; margin: 0; font-weight: 650; }
  .top .proj { color: var(--muted-foreground, #6b6b6b); font-weight: 500; }
  .stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 18px; }
  @media (max-width: 560px) { .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
  .stat { background: var(--card, #fafafa); color: var(--card-foreground, #171717); border: 1px solid var(--border, #e5e5e5);
          border-radius: var(--radius, 10px); padding: 10px 12px; }
  .stat b { display: block; font-size: 22px; line-height: 1.1; font-weight: 650; font-variant-numeric: tabular-nums; }
  .stat span { font-size: 12.5px; color: var(--muted-foreground, #6b6b6b); }
  .stat.attn b { color: var(--ck-wait); } .stat.bad b { color: var(--ck-bad); } .stat.good b { color: var(--ck-ok); }

  h2 { font-size: 13px; font-weight: 600; margin: 0 0 8px; color: var(--muted-foreground, #6b6b6b); letter-spacing: .02em; }

  /* Needs you */
  .needs { margin-bottom: 20px; }
  .need { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; margin-bottom: 8px;
          border: 1px solid var(--border, #e5e5e5); border-left: 3px solid var(--ck-wait);
          border-radius: var(--radius, 10px); background: var(--card, #fafafa); color: var(--card-foreground, #171717); }
  .need.conflict { border-left-color: var(--ck-bad); }
  .need .body { flex: 1; min-width: 0; }
  .need .q { font-weight: 550; }
  .need .sub { font-size: 12.5px; color: var(--muted-foreground, #6b6b6b); margin-top: 2px; }
  .need .quote { font-size: 13px; margin-top: 6px; padding-left: 10px; border-left: 2px solid var(--border, #e5e5e5); }
  .actions { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
  .cmd { font: 12px var(--font-mono, ui-monospace, Menlo, monospace); cursor: pointer; white-space: nowrap;
         background: var(--secondary, #f2f2f2); color: var(--secondary-foreground, #171717);
         border: 1px solid var(--border, #e5e5e5); border-radius: 7px; padding: 4px 9px; }
  .cmd:hover { background: var(--accent, #ececec); color: var(--accent-foreground, #171717); }
  .cmd.done { border-color: var(--ck-ok); color: var(--ck-ok); }
  .hint { font-size: 12px; color: var(--muted-foreground, #6b6b6b); margin: -2px 0 8px; }

  /* Tabs */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border, #e5e5e5); margin-bottom: 12px; align-items: flex-end; }
  .tab { background: none; border: 0; padding: 8px 12px; font: inherit; font-weight: 550; cursor: pointer;
         color: var(--muted-foreground, #6b6b6b); border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .tab[aria-selected="true"] { color: var(--foreground, #171717); border-bottom-color: var(--primary, #171717); }
  .tab .n { font-weight: 450; color: var(--muted-foreground, #6b6b6b); margin-left: 4px; }
  .filters { margin-left: auto; display: flex; gap: 4px; padding-bottom: 6px; }
  .chip-btn { font: 12px inherit; font-family: inherit; border: 1px solid var(--border, #e5e5e5); border-radius: 999px; padding: 2px 10px;
              background: var(--background, #fff); color: var(--muted-foreground, #6b6b6b); cursor: pointer; }
  .chip-btn[aria-pressed="true"] { background: var(--primary, #171717); color: var(--primary-foreground, #fff); border-color: var(--primary, #171717); }

  /* Points */
  .point { border: 1px solid var(--border, #e5e5e5); border-radius: var(--radius, 10px); margin-bottom: 8px;
           background: var(--card, #fafafa); color: var(--card-foreground, #171717); }
  .point > summary { list-style: none; cursor: pointer; padding: 11px 14px; display: grid;
                     grid-template-columns: auto minmax(0, 1fr) auto; gap: 2px 10px; align-items: baseline; }
  .point > summary::-webkit-details-marker { display: none; }
  .point[open] > summary { border-bottom: 1px solid var(--border, #e5e5e5); }
  .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; transform: translateY(-1px); }
  .s-resolved .dot { background: var(--ck-ok); } .s-open .dot { background: var(--ck-open); }
  .s-tabled .dot { background: var(--ck-wait); } .s-abandoned .dot { background: var(--ck-off); }
  .title { font-weight: 550; overflow-wrap: anywhere; }
  .s-abandoned .title { text-decoration: line-through; color: var(--muted-foreground, #6b6b6b); }
  .id { font: 11.5px var(--font-mono, ui-monospace, Menlo, monospace); color: var(--muted-foreground, #6b6b6b); }
  .latest { grid-column: 2 / 4; font-size: 13px; color: var(--muted-foreground, #6b6b6b); overflow-wrap: anywhere; }
  .latest b { font-weight: 550; color: var(--foreground, #171717); }
  .tags { grid-column: 2 / 4; display: flex; flex-wrap: wrap; gap: 4px; margin-top: 3px; }
  .tag { font-size: 11.5px; border-radius: 999px; padding: 0 8px; background: var(--secondary, #f2f2f2); color: var(--secondary-foreground, #444); }
  .tag.file { font-family: var(--font-mono, ui-monospace, Menlo, monospace); font-size: 11px; }
  .tag.warn { background: color-mix(in srgb, var(--ck-wait) 16%, transparent); color: var(--ck-wait); }
  .tag.bad { background: color-mix(in srgb, var(--ck-bad) 14%, transparent); color: var(--ck-bad); }
  .detail { padding: 10px 14px 14px; }
  .step { position: relative; padding: 0 0 12px 18px; }
  .step::before { content: ""; position: absolute; left: 4px; top: 7px; bottom: -3px; width: 1px; background: var(--border, #e5e5e5); }
  .step:last-child::before { display: none; }
  .step::after { content: ""; position: absolute; left: 0; top: 6px; width: 9px; height: 9px; border-radius: 50%;
                 background: var(--card, #fafafa); border: 2px solid var(--ck-ok); }
  .step.old::after { border-color: var(--ck-off); } .step.old .what { text-decoration: line-through; color: var(--muted-foreground, #6b6b6b); }
  .step .what { font-weight: 500; }
  .rule { font-size: 13px; margin-top: 2px; } .rule em { font-style: normal; font-weight: 550; }
  .meta { font-size: 12px; color: var(--muted-foreground, #6b6b6b); margin-top: 3px; }
  .detail .more { font-size: 12.5px; color: var(--muted-foreground, #6b6b6b); margin-top: 4px; }


  /* Graph */
  .gwrap { border: 1px solid var(--border, #e5e5e5); border-radius: var(--radius, 10px); background: var(--card, #fafafa);
           color: var(--card-foreground, #171717); overflow: hidden; }
  .gbar { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--border, #e5e5e5); flex-wrap: wrap; }
  .gbar .cap { flex: 1; min-width: 200px; font-size: 13px; }
  .gbar .cap b { font-weight: 600; }
  .gbody { display: grid; grid-template-columns: 172px minmax(0, 1fr); }
  .glabels { border-right: 1px solid var(--border, #e5e5e5); }
  .glabel { height: var(--g-row, 40px); display: flex; align-items: center; gap: 7px; padding: 0 10px; font-size: 12.5px; overflow: hidden; }
  .glabel span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .glabel .sw { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .glabel.main { font-weight: 600; }
  .gscroll { overflow-x: auto; overflow-y: hidden; }
  .gscroll svg { display: block; }
  .g-el { transition: opacity .35s ease-out; }
  .g-hide { opacity: 0; }
  .g-dot { cursor: pointer; }
  .g-dot:hover { filter: brightness(1.15); }
  .g-now { opacity: .35; }
  .glegend { display: flex; flex-wrap: wrap; gap: 4px 14px; padding: 8px 12px; border-top: 1px solid var(--border, #e5e5e5);
             font-size: 12px; color: var(--muted-foreground, #6b6b6b); }
  .glegend i { font-style: normal; display: inline-block; width: 18px; text-align: center; }
  .gdetail { padding: 10px 12px; border-top: 1px solid var(--border, #e5e5e5); font-size: 13px; min-height: 42px; }
  .gdetail .k { font-size: 11.5px; color: var(--muted-foreground, #6b6b6b); text-transform: uppercase; letter-spacing: .04em; }

  /* A story (demo) is just the graph playing. */
  body.story .stats, body.story #needs-pane, body.story .tabs, body.story footer { display: none; }

  /* Decisions */
  .search { width: 100%; padding: 8px 11px; margin-bottom: 10px; border-radius: 8px; font: inherit;
            border: 1px solid var(--input, #e5e5e5); background: var(--background, #fff); color: var(--foreground, #171717); }
  .search:focus { outline: 2px solid var(--ring, #a3a3a3); outline-offset: 0; }
  .dec { padding: 10px 2px; border-bottom: 1px solid var(--border, #e5e5e5); }
  .dec:last-child { border-bottom: 0; }
  .dec .what { font-weight: 550; }
  .dec.old { opacity: .6; } .dec.old .what { text-decoration: line-through; }
  .empty { padding: 18px 4px; color: var(--muted-foreground, #6b6b6b); }
  .hidden { display: none !important; }
  mark { background: color-mix(in srgb, var(--ck-wait) 28%, transparent); color: inherit; border-radius: 3px; }
  footer { margin-top: 18px; font-size: 12px; color: var(--muted-foreground, #6b6b6b); }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><h1>Creek <span class="proj">· __CREEK_TITLE__</span></h1></div>
  <div class="stats" id="stats"></div>
  <section class="needs" id="needs-pane" aria-label="Needs you"></section>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" id="tab-graph" aria-selected="true">Graph</button>
    <button class="tab" role="tab" id="tab-points" aria-selected="false">Points<span class="n" id="n-points"></span></button>
    <button class="tab" role="tab" id="tab-decisions" aria-selected="false">Decisions<span class="n" id="n-decisions"></span></button>
    <div class="filters hidden" id="filters">
      <button class="chip-btn" data-f="all" aria-pressed="true">All</button>
      <button class="chip-btn" data-f="open" aria-pressed="false">Open</button>
      <button class="chip-btn" data-f="resolved" aria-pressed="false">Done</button>
    </div>
  </div>
  <section id="graph-pane" aria-label="Graph">
    <div class="gwrap">
      <div class="gbar"><div class="cap" id="gcap"></div>
        <button class="btn-s cmd" id="gplay" type="button">Play</button></div>
      <div class="gbody"><div class="glabels" id="glabels"></div><div class="gscroll" id="gscroll"></div></div>
      <div class="gdetail" id="gdetail"><span class="muted">Click a dot for details.</span></div>
      <div class="glegend">
        <span><i>●</i>your prompt</span><span><i style="color:var(--ck-open)">●</i>decision on a point</span>
        <span><i style="color:var(--ck-wait)">◯</i>waiting on you</span><span><i>◉</i>your answer</span>
        <span><i>⤴</i>merged: point settled</span><span><i style="color:var(--ck-creek)">┈</i>Creek reminded Claude</span>
        <span><i style="color:var(--ck-bad)">╌</i>conflict</span>
      </div>
    </div>
  </section>
  <section id="points-pane" class="hidden" aria-label="Points"></section>
  <section id="decisions-pane" class="hidden" aria-label="Decisions">
    <input class="search" id="search" type="search" placeholder="Search by file, word or id, e.g. app.js or shortcut" autocomplete="off" spellcheck="false">
    <div id="decisions"></div>
    <div class="empty hidden" id="dec-empty">No decisions match.</div>
  </section>
  <footer id="foot"></footer>
</div>
<script type="application/json" id="creek-data">__CREEK_DATA__</script>
<script>
(function () {
  "use strict";
  var t0 = performance.now();
  var DATA = JSON.parse(document.getElementById("creek-data").textContent);
  var S = DATA.state;
  var nodes = S.nodes || {}, branches = S.branches || {}, records = S.records || {},
      questions = S.questions || {}, conflicts = S.conflicts || {}, prs = S.prs || {};
  var STATUS = { resolved: "Done", open: "Open", tabled: "Parked", abandoned: "Dropped" };

  function num(id) { return parseInt(String(id).slice(1), 10) || 0; }
  function byNum(a, b) { return num(a) - num(b); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function el(tag, cls, html) { var e = document.createElement(tag); if (cls) e.className = cls; if (html != null) e.innerHTML = html; return e; }
  function title(nid) { return nodes[nid] ? nodes[nid].title : nid; }
  function files(rec) { return rec.display_files || []; }
  function when(ts) { return ts ? String(ts).slice(0, 16).replace("T", " ") : ""; }

  function copyBtn(cmd, label) {
    var b = el("button", "cmd", esc(label || cmd));
    b.type = "button"; b.dataset.cmd = cmd; b.title = "Copy, then paste into the chat";
    b.addEventListener("click", function (ev) {
      ev.preventDefault(); ev.stopPropagation();
      var done = function () { b.classList.add("done"); var t = b.innerHTML; b.textContent = "copied"; setTimeout(function () { b.classList.remove("done"); b.innerHTML = t; }, 900); };
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(cmd).then(done, fallback); else fallback();
      function fallback() { var ta = document.createElement("textarea"); ta.value = cmd; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove(); }
    });
    return b;
  }

  // Derived lists ---------------------------------------------------------------
  var nodeIds = Object.keys(nodes).sort(byNum);
  var openQ = Object.keys(questions).filter(function (k) { return questions[k].status === "open"; })
    .sort(function (a, b) { return questions[b].asks - questions[a].asks || byNum(a, b); });
  var openC = Object.keys(conflicts).filter(function (k) { return conflicts[k].status === "open"; }).sort(byNum);
  var count = { open: 0, resolved: 0, tabled: 0, abandoned: 0 };
  nodeIds.forEach(function (k) { count[nodes[k].status] = (count[nodes[k].status] || 0) + 1; });
  var conflictsByNode = {};
  openC.forEach(function (cid) { conflicts[cid].records.forEach(function (rid) { var r = records[rid]; if (r) (conflictsByNode[r.node] = conflictsByNode[r.node] || []).push(cid); }); });
  var unrecorded = nodeIds.filter(function (k) { return nodes[k].unrecorded; });

  // Stats -------------------------------------------------------------------------
  var needN = openQ.length + openC.length + unrecorded.length;
  var stats = [
    { n: count.open, l: "open", cls: "" },
    { n: needN, l: needN === 1 ? "needs you" : "need you", cls: needN ? "attn" : "" },
    { n: count.resolved, l: "done", cls: count.resolved ? "good" : "" },
    { n: Object.keys(records).filter(function (k) { return records[k].active; }).length, l: "decisions kept", cls: "" }
  ];
  if (count.tabled) stats[3] = { n: count.tabled, l: "parked", cls: "attn" };
  document.getElementById("stats").innerHTML = stats.map(function (s) {
    return '<div class="stat ' + s.cls + '"><b>' + s.n + "</b><span>" + s.l + "</span></div>";
  }).join("");

  // Needs you ---------------------------------------------------------------------
  var needs = document.getElementById("needs-pane");
  if (needN) {
    needs.appendChild(el("h2", null, "Needs you"));
    needs.appendChild(el("div", "hint", "Copy a command and paste it into the chat. Commands starting with :: go to Creek, not to Claude."));
  }
  openQ.forEach(function (qid) {
    var q = questions[qid];
    var card = el("div", "need");
    card.dataset.need = qid;
    var on = q.node && nodes[q.node] ? "about " + esc(title(q.node)) : "";
    var asked = q.asks > 1 ? "asked " + q.asks + " times" : "asked once";
    card.innerHTML = '<div class="body"><div class="q">' + esc(q.text) + '</div><div class="sub">' + [asked, on].filter(Boolean).join(" · ") + ' · <span class="id">' + qid + '</span></div><div class="actions"></div></div>';
    card.querySelector(".actions").appendChild(copyBtn("::answer " + qid + " ", "::answer " + qid + " <your answer>"));
    needs.appendChild(card);
  });
  openC.forEach(function (cid) {
    var c = conflicts[cid];
    var card = el("div", "need conflict");
    card.dataset.need = cid;
    var quotes = c.records.map(function (rid) {
      var r = records[rid] || {};
      return '<div class="quote">' + esc(r.decision || rid) + ' <span class="muted">— ' + esc(title(r.node)) + ' <span class="id">' + rid + "</span></span></div>";
    }).join("");
    card.innerHTML = '<div class="body"><div class="q">Two decisions both change ' + esc((c.display_overlap || c.overlap).join(", ")) +
      '</div><div class="sub">Check they agree. <span class="id">' + cid + "</span></div>" + quotes + '<div class="actions"></div></div>';
    var a = card.querySelector(".actions");
    a.appendChild(copyBtn("::ok " + cid, "::ok " + cid + "  (both stand)"));
    a.appendChild(copyBtn("::supersede " + cid, "::supersede " + cid + "  (keep the newer)"));
    needs.appendChild(card);
  });
  unrecorded.forEach(function (nid) {
    var card = el("div", "need");
    card.dataset.need = nid;
    card.innerHTML = '<div class="body"><div class="q">' + esc(title(nid)) + '</div><div class="sub">A PR was merged with nothing recorded. Reopen it and ask Claude what was decided. <span class="id">' + nid + '</span></div><div class="actions"></div></div>';
    card.querySelector(".actions").appendChild(copyBtn("::branch " + nid.slice(1)));
    needs.appendChild(card);
  });

  // Points ------------------------------------------------------------------------
  var pointsPane = document.getElementById("points-pane");
  document.getElementById("n-points").textContent = nodeIds.length;
  if (!nodeIds.length) pointsPane.appendChild(el("div", "empty", "Nothing tracked yet. Send Claude a numbered list of what you want done and each item becomes a point here."));
  // Newest-active open points first, then the rest in brief order.
  var ordered = nodeIds.filter(function (k) { return nodes[k].status === "open"; })
    .concat(nodeIds.filter(function (k) { return nodes[k].status === "tabled"; }))
    .concat(nodeIds.filter(function (k) { return nodes[k].status === "resolved"; }))
    .concat(nodeIds.filter(function (k) { return nodes[k].status === "abandoned"; }));
  var frag = document.createDocumentFragment();
  ordered.forEach(function (nid) {
    var n = nodes[nid];
    var recs = (n.records || []).filter(function (r) { return records[r]; });
    var live = recs.filter(function (r) { return records[r].active; });
    var latest = live.length ? records[live[live.length - 1]] : null;
    var d = el("details", "point s-" + n.status);
    d.dataset.node = nid; d.dataset.status = n.status;
    var line;
    if (n.status === "tabled") line = "<b>Parked</b>" + (n.reason ? ": " + esc(n.reason) : "");
    else if (n.status === "abandoned") line = "<b>Dropped</b>" + (n.reason ? ": " + esc(n.reason) : "");
    else if (latest) line = "<b>" + (n.status === "resolved" ? "Decided" : "Latest") + ":</b> " + esc(latest.decision);
    else line = "Not started yet";
    var tags = [];
    var fileSet = [];
    live.forEach(function (r) { files(records[r]).forEach(function (f) { if (fileSet.indexOf(f) < 0) fileSet.push(f); }); });
    fileSet.slice(0, 4).forEach(function (f) { tags.push('<span class="tag file">' + esc(f) + "</span>"); });
    if (fileSet.length > 4) tags.push('<span class="tag">+' + (fileSet.length - 4) + " files</span>");
    openQ.forEach(function (q) { if (questions[q].node === nid) tags.push('<span class="tag warn">waiting on you</span>'); });
    if (conflictsByNode[nid]) tags.push('<span class="tag bad">check conflict</span>');
    if (n.unrecorded) tags.push('<span class="tag warn">unrecorded PR</span>');
    if (live.length > 1) tags.push('<span class="tag">' + live.length + " decisions</span>");
    d.innerHTML = '<summary><span class="dot" title="' + STATUS[n.status] + '"></span><span class="title">' + esc(n.title) +
      '</span><span class="id">' + nid + '</span><div class="latest">' + line + "</div>" +
      (tags.length ? '<div class="tags">' + tags.join("") + "</div>" : "") + "</summary>";
    d.addEventListener("toggle", function () { if (d.open && !d.dataset.built) { build(d, nid); d.dataset.built = "1"; } });
    frag.appendChild(d);
  });
  pointsPane.appendChild(frag);

  // A point's history is built only when it is opened, so big ledgers stay fast.
  function build(d, nid) {
    var n = nodes[nid];
    var box = el("div", "detail");
    var recs = (n.records || []).filter(function (r) { return records[r]; }).slice().reverse();
    if (!recs.length) box.appendChild(el("div", "muted", "No decisions recorded yet."));
    recs.forEach(function (rid) {
      var r = records[rid];
      var s = el("div", "step" + (r.active ? "" : " old"));
      var meta = ['<span class="id">' + rid + "</span>"];
      if (files(r).length) meta.push(esc(files(r).join(", ")));
      if (r.prs && r.prs.length) meta.push(r.prs.map(function (p) { var pr = prs[String(p)] || {}; return "PR #" + p + (pr.action ? " " + esc(pr.action) : "") + (pr.score != null ? " · " + pr.score + "/5" : ""); }).join(", "));
      if (r.question) meta.push("your answer to " + esc(r.question));
      if (!r.active) meta.push("replaced by " + esc(r.superseded_by || "a later decision"));
      if (r.ts) meta.push(esc(when(r.ts)));
      s.innerHTML = '<div class="what">' + esc(r.decision) + "</div>" +
        (r.rule ? '<div class="rule"><em>Keep in mind:</em> ' + esc(r.rule) + "</div>" : "") +
        '<div class="meta">' + meta.join(" · ") + "</div>";
      box.appendChild(s);
    });
    var edits = Object.keys(n.edits || {});
    if (edits.length) box.appendChild(el("div", "more", "Files edited: " + edits.map(function (f) { return '<span class="mono">' + esc(f) + "</span>" + (n.edits[f] > 1 ? " ×" + n.edits[f] : ""); }).join(", ")));
    var qs = Object.keys(questions).filter(function (q) { return questions[q].node === nid; });
    qs.forEach(function (q) {
      var Q = questions[q];
      box.appendChild(el("div", "more", "Question: " + esc(Q.text) + (Q.status === "answered" ? " — you said <b>" + esc(Q.answer) + "</b>" : " — waiting on you")));
    });
    var br = (n.branches || []).filter(function (b) { return branches[b] && branches[b].status === "open"; });
    if (br.length) box.appendChild(el("div", "more", "Being worked on in " + br.map(function (b) { return branches[b].kind === "fork" ? "a forked session (" + b + ")" : "this session (" + b + ")"; }).join(", ")));
    var actions = el("div", "actions");
    if (n.status === "open") { actions.appendChild(copyBtn("::table " + nid.slice(1) + " ", "::table " + nid.slice(1) + " <why>")); }
    if (n.status !== "open") actions.appendChild(copyBtn("::branch " + nid.slice(1), "::branch " + nid.slice(1) + "  (reopen)"));
    box.appendChild(actions);
    d.appendChild(box);
  }

  // Filters -------------------------------------------------------------------------
  var filterBtns = Array.prototype.slice.call(document.querySelectorAll("#filters .chip-btn"));
  filterBtns.forEach(function (b) {
    b.addEventListener("click", function () {
      filterBtns.forEach(function (x) { x.setAttribute("aria-pressed", String(x === b)); });
      var f = b.dataset.f;
      Array.prototype.forEach.call(pointsPane.querySelectorAll(".point"), function (p) {
        var st = p.dataset.status;
        var show = f === "all" || (f === "open" ? st === "open" || st === "tabled" : st === f);
        p.classList.toggle("hidden", !show);
      });
    });
  });

  // Decisions ---------------------------------------------------------------------
  var decBox = document.getElementById("decisions");
  var recIds = Object.keys(records).sort(byNum).reverse();
  document.getElementById("n-decisions").textContent = recIds.filter(function (r) { return records[r].active; }).length;
  var rows = recIds.map(function (rid) {
    var r = records[rid];
    var row = el("div", "dec" + (r.active ? "" : " old"));
    row.dataset.rec = rid;
    var meta = ['<span class="id">' + rid + "</span>", esc(title(r.node))];
    if (files(r).length) meta.push('<span class="mono">' + esc(files(r).join(", ")) + "</span>");
    if (!r.active) meta.push("replaced by " + esc(r.superseded_by || "?"));
    row.innerHTML = '<div class="what">' + esc(r.decision) + "</div>" +
      (r.rule ? '<div class="rule"><em>Keep in mind:</em> ' + esc(r.rule) + "</div>" : "") +
      '<div class="meta">' + meta.join(" · ") + "</div>";
    decBox.appendChild(row);
    var hay = [rid, r.node, title(r.node), r.decision, r.rule, (r.affects || []).join(" "), (r.tags || []).join(" ")].join(" ").toLowerCase();
    return { row: row, rec: r, hay: hay };
  });
  if (!rows.length) decBox.appendChild(el("div", "empty", "No decisions yet. Claude records one each time something is settled."));
  var search = document.getElementById("search");
  function filterDecisions() {
    var q = search.value.trim().toLowerCase(), shown = [];
    rows.forEach(function (x) {
      // Replaced decisions stay in their point's history, not in this list.
      var on = x.rec.active && (!q || q.split(/\s+/).every(function (w) { return x.hay.indexOf(w) >= 0; }));
      x.row.classList.toggle("hidden", !on);
      if (on) shown.push(x.row.dataset.rec);
    });
    document.getElementById("dec-empty").classList.toggle("hidden", shown.length > 0 || !rows.length);
    document.body.dataset.matches = shown.join(" ");
  }
  search.addEventListener("input", filterDecisions);


  // Graph ---------------------------------------------------------------------------
  // Main is your prompts; each point forks off, gains decisions, and merges back when settled.
  (function () {
    var G = DATA.graph || { cols: 0, rows: [], segments: [], dots: [], arcs: [] };
    var STORY = DATA.story || null;
    if (STORY) document.body.classList.add("story");
    var ROW = 40, PADL = 18;
    // Fit the columns to the space available; scroll sideways only for long sessions.
    var avail = (document.getElementById("gscroll").clientWidth || 600) - PADL - 30;
    var COLW = Math.max(26, Math.min(56, Math.floor(avail / Math.max(1, G.cols + 1))));
    var root = document.documentElement;
    function cssv(name, fb) { return getComputedStyle(root).getPropertyValue(name).trim() || fb; }
    var PALETTE = ["--chart-1", "--chart-2", "--chart-3", "--chart-4", "--chart-5"];
    var FALLBACK = ["#2563eb", "#16a34a", "#d97706", "#9333ea", "#db2777"];
    function laneColor(row) { if (!row) return cssv("--foreground", "#171717"); var i = (row - 1) % 5; return cssv(PALETTE[i], FALLBACK[i]); }
    function X(c) { return PADL + c * COLW; }
    function Y(r) { return r * ROW + ROW / 2; }
    var NS = "http://www.w3.org/2000/svg";
    var width = X(G.cols + 1) + 20, height = G.rows.length * ROW;
    var labels = document.getElementById("glabels");
    labels.style.setProperty("--g-row", ROW + "px");
    G.rows.forEach(function (r) {
      var d = el("div", "glabel" + (r.row === 0 ? " main" : ""));
      d.innerHTML = '<span class="sw" style="background:' + laneColor(r.row) + '"></span><span class="t" title="' + esc(r.title) + '">' +
        (r.row ? '<span class="id">' + r.id + "</span> " : "") + esc(r.title) + "</span>";
      labels.appendChild(d);
    });
    var svg = document.createElementNS(NS, "svg");
    svg.setAttribute("width", width); svg.setAttribute("height", height); svg.setAttribute("viewBox", "0 0 " + width + " " + height);
    document.getElementById("gscroll").appendChild(svg);
    var items = [];  // {node, col}
    function add(tag, attrs, col, parent) {
      var n = document.createElementNS(NS, tag);
      for (var k in attrs) n.setAttribute(k, attrs[k]);
      n.classList.add("g-el");
      (parent || svg).appendChild(n);
      items.push({ n: n, col: col });
      return n;
    }
    function tip(n, text) { var t = document.createElementNS(NS, "title"); t.textContent = text; n.appendChild(t); }
    var lines = document.createElementNS(NS, "g"); svg.appendChild(lines);
    var arcsG = document.createElementNS(NS, "g"); svg.appendChild(arcsG);
    var dotsG = document.createElementNS(NS, "g"); svg.appendChild(dotsG);
    var fg = cssv("--foreground", "#171717"), card = cssv("--card", "#fafafa");

    // Main line, one piece per column so it grows with time.
    for (var c = 1; c <= G.cols; c++) {
      add("line", { x1: X(c - 1), y1: Y(0), x2: X(c), y2: Y(0), stroke: fg, "stroke-width": 2.5, "stroke-linecap": "round",
                    "stroke-dasharray": c === G.cols ? "3 4" : "" }, c, lines);
    }
    // Branches.
    G.segments.forEach(function (s) {
      var col = laneColor(s.row), y = Y(s.row), x0 = X(s.from), bend = X(s.from) + COLW * 0.75;
      add("path", { d: "M" + x0 + " " + Y(0) + " C" + (x0 + COLW * 0.45) + " " + Y(0) + " " + (x0 + COLW * 0.3) + " " + y + " " + bend + " " + y,
                    fill: "none", stroke: col, "stroke-width": 2.5 }, s.from, lines);
      var end = s.open_to || s.to;
      for (var c2 = s.from + 1; c2 <= end; c2++) {
        var xa = Math.max(X(c2 - 1), bend);
        if (X(c2) <= xa) continue;
        add("line", { x1: xa, y1: y, x2: X(c2), y2: y, stroke: col, "stroke-width": 2.5,
                      "stroke-dasharray": s.open_to && c2 > s.to ? "3 4" : "" }, c2, lines);
      }
      if (s.merge) {
        var xm = X(s.merge), xt = X(s.to);
        add("path", { d: "M" + xt + " " + y + " C" + (xm - COLW * 0.2) + " " + y + " " + (xm - COLW * 0.35) + " " + Y(0) + " " + xm + " " + Y(0),
                      fill: "none", stroke: col, "stroke-width": 2.5 }, s.merge, lines);
      }
    });
    // Arcs: reminders bow up, conflicts bow down.
    G.arcs.forEach(function (a) {
      var x1 = X(a.a[0]), y1 = Y(a.a[1]), x2 = X(a.b[0]), y2 = Y(a.b[1]);
      var up = a.kind === "remind" ? -1 : 1, mx = (x1 + x2) / 2, my = (y1 + y2) / 2 + up * (14 + Math.abs(x2 - x1) * 0.12);
      var p = add("path", { d: "M" + x1 + " " + y1 + " Q" + mx + " " + my + " " + x2 + " " + y2, fill: "none",
                            stroke: a.kind === "remind" ? cssv("--ck-creek", "#0d9488") : cssv("--ck-bad", "#dc2626"),
                            "stroke-width": 1.6, "stroke-dasharray": a.kind === "remind" ? "1.5 4" : "5 4", "stroke-linecap": "round" },
                  Math.max(a.a[0], a.b[0]), arcsG);
      tip(p, a.label);
    });
    // Dots.
    G.dots.forEach(function (d) {
      var x = X(d.col), y = Y(d.row), col = laneColor(d.row), n;
      if (d.kind === "prompt") {
        n = add("g", {}, d.col, dotsG);
        var c0 = document.createElementNS(NS, "circle"); c0.setAttribute("cx", x); c0.setAttribute("cy", y); c0.setAttribute("r", 9); c0.setAttribute("fill", fg); n.appendChild(c0);
        var t = document.createElementNS(NS, "text"); t.setAttribute("x", x); t.setAttribute("y", y + 3.5); t.setAttribute("text-anchor", "middle");
        t.setAttribute("font-size", "10"); t.setAttribute("font-weight", "700"); t.setAttribute("fill", card); t.textContent = d.label.replace("Prompt ", "");
        n.appendChild(t);
      } else if (d.kind === "merge") {
        n = add("circle", { cx: x, cy: y, r: 4, fill: fg }, d.col, dotsG);
      } else if (d.kind === "question") {
        n = add("g", {}, d.col, dotsG);
        var q = document.createElementNS(NS, "circle"); q.setAttribute("cx", x); q.setAttribute("cy", y); q.setAttribute("r", 7);
        q.setAttribute("fill", card); q.setAttribute("stroke", cssv("--ck-wait", "#d97706")); q.setAttribute("stroke-width", 2.5); n.appendChild(q);
        var qt = document.createElementNS(NS, "text"); qt.setAttribute("x", x); qt.setAttribute("y", y + 3.5); qt.setAttribute("text-anchor", "middle");
        qt.setAttribute("font-size", "10"); qt.setAttribute("font-weight", "700"); qt.setAttribute("fill", cssv("--ck-wait", "#d97706")); qt.textContent = "?";
        n.appendChild(qt);
      } else if (d.kind === "answer") {
        n = add("g", {}, d.col, dotsG);
        var a1 = document.createElementNS(NS, "circle"); a1.setAttribute("cx", x); a1.setAttribute("cy", y); a1.setAttribute("r", 8);
        a1.setAttribute("fill", card); a1.setAttribute("stroke", col); a1.setAttribute("stroke-width", 2); n.appendChild(a1);
        var a2 = document.createElementNS(NS, "circle"); a2.setAttribute("cx", x); a2.setAttribute("cy", y); a2.setAttribute("r", 4); a2.setAttribute("fill", col); n.appendChild(a2);
      } else if (d.kind === "tabled" || d.kind === "abandoned") {
        n = add("rect", { x: x - 6, y: y - 6, width: 12, height: 12, rx: 2, fill: d.kind === "tabled" ? cssv("--ck-wait", "#d97706") : cssv("--ck-off", "#8a8a8a") }, d.col, dotsG);
      } else {
        n = add("circle", { cx: x, cy: y, r: 6.5, fill: col, stroke: card, "stroke-width": 2 }, d.col, dotsG);
      }
      n.classList.add("g-dot");
      n.dataset.col = d.col; n.dataset.kind = d.kind;
      tip(n, (d.label || "") + (d.text ? ": " + d.text : ""));
      n.addEventListener("click", function () { detail(d); });
    });

    function detail(d) {
      var box = document.getElementById("gdetail");
      var kinds = { prompt: "Your prompt", decision: "Decision", answer: "Your answer", question: "Question for you", merge: "Merged into main",
                    tabled: "Parked", abandoned: "Dropped" };
      var where = d.node && nodes[d.node] ? " · " + esc(nodes[d.node].title) : "";
      var html = '<div class="k">' + (kinds[d.kind] || d.kind) + where + "</div>";
      if (d.kind === "merge") html += "<div>" + esc(d.node && nodes[d.node] ? nodes[d.node].title : d.node) + " was settled and merged back.</div>";
      else html += "<div>" + esc(d.text || d.label) + (d.kind === "question" && d.asks > 1 ? ' <span class="muted">(asked ' + d.asks + " times)</span>" : "") + "</div>";
      if (d.rule) html += '<div class="rule"><em>Keep in mind:</em> ' + esc(d.rule) + "</div>";
      if (d.files && d.files.length) html += '<div class="meta mono">' + esc(d.files.join(", ")) + "</div>";
      box.innerHTML = html;
    }

    // Drawing over time ------------------------------------------------------------------
    var shown = G.cols, timer = null;
    var cap = document.getElementById("gcap"), play = document.getElementById("gplay"), scroller = document.getElementById("gscroll");
    function setCol(c) {
      shown = c;
      items.forEach(function (it) { it.n.classList.toggle("g-hide", it.col > c); });
      var x = X(c) - scroller.clientWidth + 120;
      if (x > scroller.scrollLeft || X(c) < scroller.scrollLeft) scroller.scrollLeft = Math.max(0, x);
      if (STORY) {
        var cur = null;
        STORY.forEach(function (s) { if (s.col <= c) cur = s; });
        cap.innerHTML = cur ? "<b>" + esc(cur.title) + "</b> " + esc(cur.text) : "";
      }
    }
    function stop() { clearTimeout(timer); timer = null; play.textContent = "Play"; }
    function step() {
      if (shown >= G.cols) { stop(); if (!STORY) cap.innerHTML = summary(); return; }
      setCol(shown + 1);
      var pause = 650;
      if (STORY && STORY.some(function (s) { return s.col === shown; })) pause = 3600;
      timer = setTimeout(step, pause);
    }
    function start() { stop(); play.textContent = "Pause"; setCol(0); timer = setTimeout(step, 500); }
    play.addEventListener("click", function () { if (timer) stop(); else if (shown >= G.cols) start(); else { play.textContent = "Pause"; step(); } });
    function summary() {
      var prompts = G.dots.filter(function (d) { return d.kind === "prompt"; }).length;
      var merges = G.dots.filter(function (d) { return d.kind === "merge"; }).length;
      var waiting = G.dots.filter(function (d) { return d.kind === "question" && questions[d.id] && questions[d.id].status === "open"; }).length;
      return "<b>" + prompts + " prompt" + (prompts === 1 ? "" : "s") + ", " + (G.rows.length - 1) + " points, " + merges + " merge" + (merges === 1 ? "" : "s") + ".</b> " +
        (waiting ? waiting + " branch" + (waiting === 1 ? " is" : "es are") + " waiting on you." : "Press Play to watch it grow.");
    }
    if (!G.cols) { cap.textContent = "Nothing yet. Send a prompt and the graph starts here."; play.classList.add("hidden"); }
    else if (STORY) start();
    else { setCol(G.cols); cap.innerHTML = summary(); }
  })();

  // Tabs ----------------------------------------------------------------------------
  var tabs = { graph: document.getElementById("tab-graph"), points: document.getElementById("tab-points"), decisions: document.getElementById("tab-decisions") };
  function show(which) {
    Object.keys(tabs).forEach(function (k) {
      tabs[k].setAttribute("aria-selected", String(k === which));
      document.getElementById(k + "-pane").classList.toggle("hidden", k !== which);
    });
    document.getElementById("filters").classList.toggle("hidden", which !== "points");
  }
  tabs.graph.addEventListener("click", function () { show("graph"); });
  tabs.points.addEventListener("click", function () { show("points"); });
  tabs.decisions.addEventListener("click", function () { show("decisions"); search.focus(); });

  var h = /[#&]q=([^&]*)/.exec(location.hash);
  if (h) { search.value = decodeURIComponent(h[1]); show("decisions"); }
  else if (/[#&]tab=points/.test(location.hash)) show("points");
  filterDecisions();

  var ms = performance.now() - t0;
  document.body.dataset.renderMs = ms.toFixed(1);
  document.body.dataset.loadMs = performance.now().toFixed(1);
  document.getElementById("foot").textContent = "Updated " + when(DATA.generated) + " UTC · type ::map in the chat to refresh";
})();
</script>
</body>
</html>
